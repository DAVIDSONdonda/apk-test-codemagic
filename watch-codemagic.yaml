workflows:
  android-watch-debug:
    name: Ma Montre - Android APK
    max_build_duration: 60
    environment:
      java: 11
    scripts:
      - name: Extract and build APK
        script: |
          rm -rf source
          mkdir source
          unzip -q watch-apk-test.zip -d source
          cd source
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - source/app/build/outputs/apk/debug/app-debug.apk
